
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a2e;--paper:#faf8f3;--accent:#c8602a;--accent2:#2a6c8e;
  --muted:#7a7265;--border:#e0dbd0;--card:#fff;--success:#2d6a4f;--error:#c8602a;
}
body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
h1,h2,h3{font-family:'Playfair Display',serif}

#app{max-width:680px;margin:0 auto;padding:1.5rem 1rem}

.header{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.header h1{font-size:26px;color:var(--ink);margin-bottom:4px}
.header p{color:var(--muted);font-size:14px}

.tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:1.5rem}
.tab{flex:1;padding:10px;font-size:13px;font-weight:600;background:transparent;border:none;cursor:pointer;color:var(--muted);font-family:'Source Sans 3',sans-serif;transition:all .2s}
.tab.active{background:var(--ink);color:#fff}

/* GLOSSARY */
.search-bar{display:flex;gap:8px;margin-bottom:1rem}
.search-bar input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:var(--card);font-family:'Source Sans 3',sans-serif;color:var(--ink)}
.word-list{display:flex;flex-direction:column;gap:8px}
.word-entry{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s}
.word-entry:hover{border-color:var(--accent2)}
.word-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.word-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--ink)}
.word-pos{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:#fdf0e8;padding:2px 8px;border-radius:4px}
.word-body{padding:0 16px 14px;border-top:1px solid var(--border);display:none}
.word-body.open{display:block}
.definition{font-size:14px;color:var(--ink);line-height:1.7;margin-top:10px}
.example{font-size:13px;color:var(--muted);font-style:italic;margin-top:6px;padding-left:12px;border-left:2px solid var(--border)}
.ox-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent2);margin-top:8px;text-decoration:none}

/* FLASHCARDS */
.fc-progress{font-size:13px;color:var(--muted);text-align:center;margin-bottom:12px}
.fc-card{perspective:800px;height:200px;margin-bottom:1.5rem;cursor:pointer}
.fc-inner{width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;position:relative}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;border:1px solid var(--border)}
.fc-front{background:var(--ink);color:#fff}
.fc-front h2{font-size:28px;color:#fff;text-align:center}
.fc-front p{font-size:12px;color:rgba(255,255,255,.5);margin-top:8px}
.fc-back{background:var(--card);transform:rotateY(180deg)}
.fc-back .def{font-size:14px;color:var(--ink);text-align:center;line-height:1.7}
.fc-back .pos{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.fc-back .ex{font-size:12px;color:var(--muted);font-style:italic;margin-top:8px;text-align:center}
.fc-nav{display:flex;gap:8px;justify-content:center}
.fc-nav button{padding:9px 20px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:13px;color:var(--ink)}
.fc-nav button:hover{background:var(--border)}
.fc-nav button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.shuffle-btn{display:block;margin:0 auto 1rem;padding:7px 16px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-family:'Source Sans 3',sans-serif;color:var(--muted)}

/* QUIZ */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.quiz-score{font-size:13px;color:var(--muted)}
.quiz-q{background:var(--ink);color:#fff;border-radius:12px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.quiz-q .qtype{font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.quiz-q .qtext{font-size:15px;line-height:1.6}
.quiz-q .qtext strong{font-family:'Playfair Display',serif;font-size:18px;color:#fff}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.choice{padding:11px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:14px;text-align:left;font-family:'Source Sans 3',sans-serif;color:var(--ink);transition:all .15s;line-height:1.5}
.choice:hover:not(:disabled){border-color:var(--accent2);background:#f0f7fb}
.choice.correct{background:#e8f5ee;border-color:var(--success);color:var(--success)}
.choice.wrong{background:#fdf0e8;border-color:var(--error);color:var(--error)}
.choice:disabled{cursor:default}
.feedback{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:1rem}
.feedback.correct{background:#e8f5ee;color:var(--success)}
.feedback.wrong{background:#fdf0e8;color:var(--error)}
.next-btn{width:100%;padding:11px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Source Sans 3',sans-serif}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);transition:width .3s}
.result-box{text-align:center;padding:2rem;background:var(--card);border-radius:14px;border:1px solid var(--border)}
.result-box h2{font-size:32px;margin-bottom:8px;color:var(--ink)}
.result-box p{color:var(--muted);font-size:14px;margin-bottom:1.5rem}
.score-big{font-size:56px;font-weight:700;color:var(--accent);font-family:'Playfair Display',serif}
</style>

<div id="app">
  <div class="header">
    <h1>Thames Vocabulary</h1>
    <p>34 words & phrases from the reading passage</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('glossary')">📖 Glossary</button>
    <button class="tab" onclick="showTab('flashcards')">🃏 Flashcards</button>
    <button class="tab" onclick="showTab('quiz')">✏️ Quiz</button>
  </div>
  <div id="glossary-tab"></div>
  <div id="flashcards-tab" style="display:none"></div>
  <div id="quiz-tab" style="display:none"></div>
</div>

<script>
const WORDS = [
  {word:"metropolitan",pos:"adj",def:"relating to a large, important city",ex:"The metropolitan area includes the city and surrounding suburbs."},
  {word:"sewage",pos:"noun",def:"waste water and other waste material carried away from houses and factories",ex:"The sewage treatment plant processes waste from the whole city."},
  {word:"effluent",pos:"noun",def:"liquid waste, especially chemicals produced by factories, that flows into rivers or the sea",ex:"Industrial effluent was poisoning the river for decades."},
  {word:"rosy",pos:"adj",def:"seeming to offer good possibilities; optimistic",ex:"The future looked rosy for the company after the successful launch."},
  {word:"legislation",pos:"noun",def:"a law or set of laws passed by a parliament",ex:"New legislation was introduced to protect endangered species."},
  {word:"premises",pos:"noun",def:"the building and land near to it that a business owns or uses",ex:"Smoking is not permitted on the premises."},
  {word:"dispose",pos:"verb",def:"to get rid of something that you do not want or cannot keep",ex:"Companies must dispose of chemical waste responsibly."},
  {word:"disparate",pos:"adj",def:"made up of parts or people that are very different from each other",ex:"The project brought together a disparate group of scientists and engineers."},
  {word:"stakeholder",pos:"noun",def:"a person or company that is involved in a particular organization or project, especially one who has invested money in it",ex:"All stakeholders were consulted before the decision was made."},
  {word:"boroughs",pos:"noun",def:"towns or districts that have their own local government",ex:"The city is divided into several boroughs, each with its own council."},
  {word:"flanks",pos:"verb",def:"to be placed on one or both sides of something",ex:"The road is flanked by tall trees on both sides."},
  {word:"wields",pos:"verb",def:"to have and use power, authority or influence",ex:"She wields considerable influence over company policy."},
  {word:"compelling",pos:"adj",def:"very strong; forcing you to do something or believe something",ex:"The scientist made a compelling argument for more research funding."},
  {word:"stretch",pos:"noun",def:"an area of land or water, especially a long one",ex:"This stretch of river is popular with fishermen."},
  {word:"viability",pos:"noun",def:"the ability to work as intended or to succeed",ex:"Experts questioned the viability of the new transport project."},
  {word:"mayor",pos:"noun",def:"the head of the government of a town or city",ex:"The mayor opened the new community centre last Friday."},
  {word:"charged",pos:"verb",def:"given a responsibility or duty",ex:"The committee was charged with reviewing safety regulations."},
  {word:"amenity",pos:"noun",def:"a feature that makes a place pleasant or easy to live in",ex:"The park is an important public amenity enjoyed by thousands."},
  {word:"porpoise",pos:"noun",def:"a sea animal that looks like a small whale and swims in groups",ex:"A pod of porpoises was spotted near the harbour."},
  {word:"vessels",pos:"noun",def:"large boats or ships",ex:"Several vessels were waiting to enter the port."},
  {word:"inspecting",pos:"verb",def:"looking closely at something to check its condition or quality",ex:"Officers were inspecting all boats entering the harbour."},
  {word:"litter",pos:"noun",def:"small pieces of rubbish/garbage left in public places",ex:"The council imposed heavy fines for dropping litter."},
  {word:"tidal",pos:"adj",def:"relating to or affected by tides",ex:"The tidal river floods twice a day."},
  {word:"tributaries",pos:"noun",def:"rivers or streams that flow into a larger river",ex:"The Thames has several important tributaries including the River Lea."},
  {word:"floating",pos:"verb",def:"moving slowly on or near the surface of a liquid",ex:"Pieces of plastic were floating on the surface of the river."},
  {word:"cage",pos:"noun",def:"a structure made of metal bars in which animals are kept",ex:"The large cage was placed in the river to catch floating rubbish."},
  {word:"offshore",pos:"adv",def:"in or into the sea, not far from the coast",ex:"The device was moored just offshore from the naval college."},
  {word:"welter",pos:"noun",def:"a large and confusing number of things",ex:"A welter of agencies shared responsibility for the river's upkeep."},
  {word:"bore",pos:"verb",def:"(past tense of bear) to carry or be responsible for something",ex:"Each organisation bore part of the responsibility for river safety."},
  {word:"accountability",pos:"noun",def:"the fact of being responsible for your decisions or actions and having to explain them when asked",ex:"The new system improved accountability across all departments."},
  {word:"starved of",pos:"phrase",def:"lacking something essential, especially over a long period",ex:"The river was starved of oxygen and could not support life."},
  {word:"spot checks",pos:"phrase",def:"a check made suddenly and without warning on a random selection of people or things",ex:"Officers carried out spot checks on vessels using the river."},
  {word:"remit",pos:"noun",def:"the area of activity over which a particular person or organization has authority or control",ex:"Monitoring water quality falls within the agency's remit."},
  {word:"hold somebody to account",pos:"phrase",def:"to require someone to explain and justify their actions",ex:"The public expects the government to hold polluters to account."},
];

let currentTab = 'glossary';
let fcIndex = 0;
let fcFlipped = false;
let fcOrder = [...Array(WORDS.length).keys()];
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let filterText = '';

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['glossary','flashcards','quiz'][i] === tab);
  });
  ['glossary','flashcards','quiz'].forEach(t => {
    document.getElementById(t+'-tab').style.display = t===tab?'block':'none';
  });
  if (tab==='glossary') renderGlossary();
  if (tab==='flashcards') renderFlashcard();
  if (tab==='quiz') { quizQuestions=buildQuiz(); quizIndex=0; quizScore=0; renderQuiz(); }
}

function renderGlossary() {
  const filtered = WORDS.filter(w => w.word.toLowerCase().includes(filterText) || w.def.toLowerCase().includes(filterText));
  document.getElementById('glossary-tab').innerHTML = `
    <div class="search-bar">
      <input type="text" placeholder="Search words..." id="searchInput" value="${filterText}" oninput="filterSearch(this.value)">
    </div>
    <div class="word-list">
      ${filtered.map((w,i)=>`
        <div class="word-entry" onclick="toggleEntry(${i})">
          <div class="word-header">
            <span class="word-title">${w.word}</span>
            <span class="word-pos">${w.pos}</span>
          </div>
          <div class="word-body" id="entry-${i}">
            <div class="definition">${w.def}</div>
            <div class="example">"${w.ex}"</div>
            <a class="ox-link" href="https://www.oxfordlearnersdictionaries.com/definition/english/${encodeURIComponent(w.word.split(' ')[0].toLowerCase())}" target="_blank">
              <i class="ti ti-external-link" aria-hidden="true"></i> View in Oxford Dictionary
            </a>
          </div>
        </div>
      `).join('')}
    </div>`;
}

function filterSearch(val) {
  filterText = val.toLowerCase();
  renderGlossary();
  document.getElementById('searchInput').focus();
}

function toggleEntry(i) {
  const el = document.getElementById('entry-'+i);
  el.classList.toggle('open');
}

function renderFlashcard() {
  const w = WORDS[fcOrder[fcIndex]];
  document.getElementById('flashcards-tab').innerHTML = `
    <div class="fc-progress">${fcIndex+1} / ${WORDS.length}</div>
    <button class="shuffle-btn" onclick="shuffleFC()">🔀 Shuffle</button>
    <div class="fc-card" onclick="flipCard()">
      <div class="fc-inner ${fcFlipped?'flipped':''}" id="fcInner">
        <div class="fc-face fc-front">
          <h2>${w.word}</h2>
          <p>tap to reveal definition</p>
        </div>
        <div class="fc-face fc-back">
          <div class="pos">${w.pos}</div>
          <div class="def">${w.def}</div>
          <div class="ex">"${w.ex}"</div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button onclick="fcNav(-1)">← Prev</button>
      <button class="primary" onclick="fcNav(1)">Next →</button>
    </div>`;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('fcInner').classList.toggle('flipped', fcFlipped);
}

function fcNav(dir) {
  fcIndex = (fcIndex + dir + WORDS.length) % WORDS.length;
  fcFlipped = false;
  renderFlashcard();
}

function shuffleFC() {
  for(let i=fcOrder.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [fcOrder[i],fcOrder[j]]=[fcOrder[j],fcOrder[i]];
  }
  fcIndex=0; fcFlipped=false; renderFlashcard();
}

function buildQuiz() {
  const qs = [];
  const shuffled = [...WORDS].sort(()=>Math.random()-.5).slice(0, 15);
  shuffled.forEach(w => {
    const type = Math.random() > 0.5 ? 'def' : 'fill';
    const wrongs = WORDS.filter(x=>x.word!==w.word).sort(()=>Math.random()-.5).slice(0,3);
    if(type==='def') {
      const choices = [w.def, ...wrongs.map(x=>x.def)].sort(()=>Math.random()-.5);
      qs.push({type:'def', word:w.word, correct:w.def, choices, explanation:`"${w.word}" means: ${w.def}`});
    } else {
      const sentence = w.ex.replace(new RegExp(w.word.split(' ')[0],'i'),'_____');
      const choices = [w.word, ...wrongs.map(x=>x.word)].sort(()=>Math.random()-.5);
      qs.push({type:'fill', word:w.word, sentence, correct:w.word, choices, explanation:`The answer is "${w.word}" — ${w.def}`});
    }
  });
  return qs;
}

function renderQuiz() {
  const tab = document.getElementById('quiz-tab');
  if(quizIndex >= quizQuestions.length) {
    const pct = Math.round((quizScore/quizQuestions.length)*100);
    tab.innerHTML = `<div class="result-box">
      <div class="score-big">${quizScore}/${quizQuestions.length}</div>
      <h2>Quiz complete!</h2>
      <p>${pct>=80?'Excellent work! You know these words well.':pct>=60?'Good effort! Keep reviewing the ones you missed.':'Keep studying — try the flashcards and come back!'}</p>
      <button class="next-btn" onclick="restartQuiz()">Try again</button>
    </div>`;
    return;
  }
  const q = quizQuestions[quizIndex];
  const prog = ((quizIndex)/quizQuestions.length*100).toFixed(0);
  tab.innerHTML = `
    <div class="quiz-header">
      <span class="quiz-score">Score: ${quizScore} / ${quizQuestions.length}</span>
      <span class="quiz-score">Q${quizIndex+1} of ${quizQuestions.length}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
    <div class="quiz-q">
      <div class="qtype">${q.type==='def'?'Choose the correct definition':'Fill in the blank'}</div>
      <div class="qtext">${q.type==='def'?`What does <strong>${q.word}</strong> mean?`:`Complete the sentence:<br><br>"${q.sentence}"`}</div>
    </div>
    <div class="choices">
      ${q.choices.map(c=>`<button class="choice" onclick="answerQuiz('${c.replace(/'/g,"\\'")}', this)">${c}</button>`).join('')}
    </div>
    <div id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none">Next question →</button>`;
}

function answerQuiz(choice, btn) {
  if(quizAnswered) return;
  quizAnswered = true;
  const q = quizQuestions[quizIndex];
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  if(choice === q.correct) {
    btn.classList.add('correct');
    quizScore++;
    document.getElementById('feedback').innerHTML=`<div class="feedback correct">✓ Correct! ${q.explanation}</div>`;
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.choice').forEach(b=>{ if(b.textContent===q.correct) b.classList.add('correct'); });
    document.getElementById('feedback').innerHTML=`<div class="feedback wrong">✗ Not quite. ${q.explanation}</div>`;
  }
  document.getElementById('nextBtn').style.display='block';
}

function nextQuestion() {
  quizAnswered = false;
  quizIndex++;
  renderQuiz();
}

function restartQuiz() {
  quizQuestions=buildQuiz(); quizIndex=0; quizScore=0; quizAnswered=false; renderQuiz();
}

renderGlossary();
</script>
